<svg width="48" height="48" viewBox="3 3 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 뒤: 회색 가이드 원 (그리려는 도형) -->
  <circle cx="24" cy="24" r="14" fill="none" stroke="#EAE1CE" stroke-width="2.2"/>
  <!-- 앞: 파란 선으로 원을 약 2/3 그린 궤적 (진행 중) -->
  <path d="M 24 10 A 14 14 0 1 1 11 28.5"
        fill="none" stroke="url(#sd_arc)" stroke-width="3" stroke-linecap="round"/>
  <!-- 크레용: 뾰족 팁 + 둥근 지우개 끝 (팁이 아크 끝점에 정확히 닿음) -->
  <path d="M 0 0 L 4 -2.3 L 11 -2.3 A 2.3 2.3 0 0 1 11 2.3 L 4 2.3 Z"
        transform="translate(11 28.5) rotate(-45)"
        fill="url(#sd_body)"/>
  <defs>
    <linearGradient id="sd_arc" x1="10" y1="12" x2="38" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A6CEF1"/>
      <stop offset="1" stop-color="#6BADE8"/>
    </linearGradient>
    <linearGradient id="sd_body" x1="0" y1="0" x2="11" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4DEF6"/>
      <stop offset="1" stop-color="#6BADE8"/>
    </linearGradient>
  </defs>
</svg>
